[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikant"
version = "0.14.0a1"
description = "Temporal epistemic control runtime with provenance, calibrated uncertainty, commitment continuity and deterministic replay"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ikant = "ikant.app_cli:main"

[tool.setuptools.packages.find]
include = ["ikant*"]
