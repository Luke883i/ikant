name: iKant CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ikant-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  started:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish hosted CI running receipt
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ikant-hosted-ci-receipt -->';
            const body = [marker,'## iKant hosted CI receipt','','HOSTED_CI: RUNNING',`HEAD_SHA: ${context.sha}`,'','Hosted release gates are executing.'].join('\n');
            const { owner, repo } = context.repo; const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const previous = comments.find((c) => c.body && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});

  unit-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m compileall -q ikant tests scripts
      - name: Unit, edge and anti-regression tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Real dynamics tuning search
        run: python scripts/tune_dynamics.py
      - name: Quick release gate
        run: python scripts/release_gate.py --quick

  epistemic-core-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {seed: [17, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/epistemic_core_stress.py --cases 20000 --tail 10000 --seed ${{ matrix.seed }}
      - run: python scripts/epistemic_core_mutations.py --mutations 20000 --tail 10000 --seed ${{ matrix.seed }}

  practical-reason-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {seed: [17, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/practical_reason_stress.py --cases 20000 --tail 10000 --seed ${{ matrix.seed }}
      - run: python scripts/practical_reason_mutations.py --mutations 20000 --tail 10000 --seed ${{ matrix.seed }}

  planning-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {seed: [17, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/planning_stress.py --cases 20000 --tail 10000 --seed ${{ matrix.seed }}
      - run: python scripts/planning_mutations.py --mutations 20000 --tail 10000 --seed ${{ matrix.seed }}

  execution-handoff-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix: {seed: [17, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/execution_stress.py --cases 20000 --tail 10000 --seed ${{ matrix.seed }}
      - run: python scripts/execution_mutations.py --mutations 20000 --tail 10000 --seed ${{ matrix.seed }}

  host-conformance-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix: {seed: [17, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/host_conformance_stress.py --cases 20000 --tail 10000 --seed ${{ matrix.seed }}
      - run: python scripts/host_conformance_mutations.py --mutations 20000 --tail 10000 --seed ${{ matrix.seed }}

  static-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/stress.py --cases 10000 --novelty-tail 1000 --seed 883

  dynamic-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {seed: [1, 17, 97, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/dynamic_stress.py --operations 10000 --novelty-tail 1000 --seed ${{ matrix.seed }}

  crc-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {seed: [1, 17, 97, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/crc_stress.py --cases 10000 --seed ${{ matrix.seed }}

  cognitive-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix: {seed: [17, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/cognitive_stress.py --turns 500 --novelty-tail 100 --seed ${{ matrix.seed }}

  edge-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: {seed: [1, 97, 883]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/edge_stress.py --cases 10000 --seed ${{ matrix.seed }}

  central-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: {seed: [1, 97, 883]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/central_stress.py --cases 10000 --seed ${{ matrix.seed }}

  surface-a-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: {seed: [1, 883]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/surface_a_stress.py --cases 10000 --seed ${{ matrix.seed }}

  dialogue-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/dialogue_smoke.py

  browser-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify browser engine
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Public landing real-browser liveness
        run: node scripts/public_v1_browser_liveness.mjs
      - name: Public landing source invariants
        run: python -m unittest tests.test_public_v1_liveness -v
      - name: Public landing 10M mutation saturation
        run: python scripts/public_v1_liveness_falsify.py --mutations 10000000 --tail 10000 --seed 202608231043

  report:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [started, unit-and-gates, epistemic-core-stress, practical-reason-stress, planning-stress, execution-handoff-stress, host-conformance-stress, static-stress, dynamic-stress, crc-stress, cognitive-stress, edge-stress, central-stress, surface-a-stress, dialogue-smoke, browser-liveness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish hosted CI final receipt to PR
        uses: actions/github-script@v7
        with:
          script: |
            const states = {
              started:'${{ needs.started.result }}', unit_and_gates:'${{ needs.unit-and-gates.result }}', epistemic_core:'${{ needs.epistemic-core-stress.result }}', practical_reason:'${{ needs.practical-reason-stress.result }}', planning:'${{ needs.planning-stress.result }}', execution_handoff:'${{ needs.execution-handoff-stress.result }}', host_conformance:'${{ needs.host-conformance-stress.result }}',
              static_stress:'${{ needs.static-stress.result }}', dynamic_stress:'${{ needs.dynamic-stress.result }}', crc_stress:'${{ needs.crc-stress.result }}', cognitive_stress:'${{ needs.cognitive-stress.result }}', edge_stress:'${{ needs.edge-stress.result }}', central_stress:'${{ needs.central-stress.result }}', surface_a_stress:'${{ needs.surface-a-stress.result }}', dialogue_smoke:'${{ needs.dialogue-smoke.result }}', browser_liveness:'${{ needs.browser-liveness.result }}'
            };
            const ok = Object.values(states).every((v) => v === 'success');
            const marker = '<!-- ikant-hosted-ci-receipt -->';
            const body = [marker,'## iKant hosted CI receipt','',`HOSTED_CI: ${ok ? 'PASS' : 'FAIL'}`,`HEAD_SHA: ${context.sha}`,`unit-and-gates: ${states.unit_and_gates}`,`browser-liveness[real Chromium + 10M mutations]: ${states.browser_liveness}`,`epistemic-core[3 x (20000+10000) + mutations]: ${states.epistemic_core}`,`practical-reason[3 x (20000+10000) + mutations]: ${states.practical_reason}`,`planning[3 x (20000+10000) + mutations]: ${states.planning}`,`execution-handoff[3 x (20000+10000) + mutations]: ${states.execution_handoff}`,`host-conformance[3 x (20000+10000) + mutations]: ${states.host_conformance}`,`static-stress: ${states.static_stress}`,`dynamic-stress[1,17,97,883,2026]: ${states.dynamic_stress}`,`crc-stress[1,17,97,883,2026]: ${states.crc_stress}`,`cognitive-stress[17,883,2026]: ${states.cognitive_stress}`,`edge-stress[1,97,883]: ${states.edge_stress}`,`central-stress[1,97,883]: ${states.central_stress}`,`surface-a-stress[1,883]: ${states.surface_a_stress}`,`dialogue-smoke: ${states.dialogue_smoke}`,'','This receipt is emitted by `.github/workflows/ci.yml` after all release gates complete.'].join('\n');
            const { owner, repo } = context.repo; const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const previous = comments.find((c) => c.body && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
            if (!ok) core.setFailed(`Hosted CI failed: ${JSON.stringify(states)}`);
