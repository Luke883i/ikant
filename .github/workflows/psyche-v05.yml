name: iKant v0.5 psyche
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  psyche-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall -q ikant tests scripts
      - run: python -W error::ResourceWarning -m unittest tests.test_psyche_v05 tests.test_runtime_psyche_v05 -v
  psyche-saturation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy: {fail-fast: false, matrix: {seed: [1, 17, 97, 883, 2026]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/psyche_stress.py --cases 10000 --tail 10000 --seed ${{ matrix.seed }}
  regulation-saturation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: {fail-fast: false, matrix: {seed: [1, 17, 97, 883, 2026]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/self_regulation_stress.py --cases 10000 --seed ${{ matrix.seed }}
  durable-psyche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy: {fail-fast: false, matrix: {seed: [17, 883, 2026]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/psyche_runtime_stress.py --turns 180 --seed ${{ matrix.seed }}
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -q
  report:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [psyche-unit, psyche-saturation, regulation-saturation, durable-psyche, regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const states={unit:'${{ needs.psyche-unit.result }}',psyche_saturation:'${{ needs.psyche-saturation.result }}',regulation_saturation:'${{ needs.regulation-saturation.result }}',durable_psyche:'${{ needs.durable-psyche.result }}',regression:'${{ needs.regression.result }}'};
            const ok=Object.values(states).every(v=>v==='success');const marker='<!-- ikant-v05-psyche-ci-receipt -->';
            const body=[marker,'## iKant v0.5 psyche receipt','',`PSYCHE_V05_CI: ${ok?'PASS':'FAIL'}`,`HEAD_SHA: ${context.sha}`,`unit-and-tamper: ${states.unit}`,`psyche-saturation[5 x (10k+10k)]: ${states.psyche_saturation}`,`regulation-saturation[5 x 10k]: ${states.regulation_saturation}`,`durable-psyche[17,883,2026]: ${states.durable_psyche}`,`regression: ${states.regression}`,'','Functional-psyche engineering gates only; not evidence of consciousness or neuroscientific equivalence.'].join('\n');
            const {owner,repo}=context.repo;const issue_number=context.issue.number;const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});const previous=comments.find(c=>c.body&&c.body.includes(marker));if(previous)await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});else await github.rest.issues.createComment({owner,repo,issue_number,body});if(!ok)core.setFailed(`v0.5 psyche gates failed: ${JSON.stringify(states)}`);
