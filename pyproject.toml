[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikant"
version = "0.16.0a1"
description = "Practical planning runtime with explicit plan DAGs, symbolic world-state, rollback graphs and Pareto decision lattices"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ikant = "ikant.app_cli:main"

[tool.setuptools.packages.find]
include = ["ikant*"]
