name: iKant Unit Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ikant-unit-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-unit-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run exact full-unit gate
        id: unit
        shell: bash
        run: |
          set +e
          python -W error::ResourceWarning -m unittest discover -s tests -v > unit-diagnostic.log 2>&1
          rc=$?
          python - <<'PY'
          from pathlib import Path
          import re
          raw=Path('unit-diagnostic.log').read_text(encoding='utf-8',errors='replace')
          blocks=[]
          pat=re.compile(r'={70}\n(FAIL|ERROR): ([^\n]+)\n-{70}\n(.*?)(?=\n={70}\n(?:FAIL|ERROR):|\n-{70}\nRan |\Z)',re.S)
          for kind,name,detail in pat.findall(raw):
              clean=[]
              for line in detail.splitlines():
                  clean.append(line if len(line)<=600 else '[long assertion payload omitted]')
              blocks.append(f'{kind}: {name}\n'+'\n'.join(clean[:24]))
          final=re.search(r'FAILED \([^\n]+\)|OK$',raw,re.M)
          if final: blocks.append(final.group(0))
          Path('unit-summary.txt').write_text('\n\n'.join(blocks)[:12000],encoding='utf-8')
          PY
          cat unit-diagnostic.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Publish bounded unit diagnostic receipt
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          UNIT_EXIT_CODE: ${{ steps.unit.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ikant-unit-diagnostic -->';
            const ok = process.env.UNIT_EXIT_CODE === '0';
            const head = context.payload.pull_request?.head?.sha || context.sha;
            let detail = '';
            if (!ok && fs.existsSync('unit-summary.txt')) detail = fs.readFileSync('unit-summary.txt','utf8').replace(/```/g,'` ` `');
            const body = [
              marker,
              '## iKant full-unit diagnostic',
              '',
              `UNIT_DIAGNOSTIC: ${ok ? 'PASS' : 'FAIL'}`,
              `MERGE_SHA: ${context.sha}`,
              `HEAD_SHA: ${head}`,
              ...(ok ? [] : ['', '```text', detail, '```']),
              '',
              'Diagnostic projection only; it grants no authority and does not weaken the full-unit gate.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const previous = comments.find((c) => c.body && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
