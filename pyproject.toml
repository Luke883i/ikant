[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikant"
version = "0.10.0a1"
description = "ROA-aligned reticular cognitive runtime with digest-bound admission and crash-recoverable exclusive dashboard egress"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ikant = "ikant.v05_cli:main"

[tool.setuptools.packages.find]
include = ["ikant*"]
