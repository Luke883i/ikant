[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikant"
version = "0.22.0a1"
description = "Governed local epistemic agent runtime with capability-bound web and native agency"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ikant = "ikant.app_cli:main"

[tool.setuptools.packages.find]
include = ["ikant*"]
