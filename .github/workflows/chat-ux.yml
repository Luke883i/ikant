name: iKant v0.4 chat UX

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  chat-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall -q ikant tests scripts
      - run: python -W error::ResourceWarning -m unittest tests.test_chat_v04 tests.test_chat_host_v04 -v

  ux-saturation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/chat_ux_stress.py --cases 10000 --novelty-tail 2000 --seed 883

  runtime-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/chat_runtime_stress.py --turns 60

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -q

  report:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [chat-unit, ux-saturation, runtime-stress, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish v0.4 chat UX receipt
        uses: actions/github-script@v7
        with:
          script: |
            const states = {
              chat_unit: '${{ needs.chat-unit.result }}',
              ux_saturation: '${{ needs.ux-saturation.result }}',
              runtime_stress: '${{ needs.runtime-stress.result }}',
              regression: '${{ needs.regression.result }}'
            };
            const ok = Object.values(states).every((v) => v === 'success');
            const marker = '<!-- ikant-chat-ux-ci-receipt -->';
            const body = [
              marker,
              '## iKant v0.4 chat UX receipt',
              '',
              `CHAT_UX_CI: ${ok ? 'PASS' : 'FAIL'}`,
              `HEAD_SHA: ${context.sha}`,
              `chat-unit: ${states.chat_unit}`,
              `ux-saturation[10000+2000]: ${states.ux_saturation}`,
              `runtime-stress[60]: ${states.runtime_stress}`,
              `regression: ${states.regression}`,
              '',
              'The receipt is emitted after all v0.4 chat-design-system gates finish.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const previous = comments.find((c) => c.body && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
            if (!ok) core.setFailed(`v0.4 chat UX gates failed: ${JSON.stringify(states)}`);
