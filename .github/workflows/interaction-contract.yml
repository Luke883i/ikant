name: iKant interaction contract

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  host-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile host boundary
        run: python -m compileall -q ikant tests scripts
      - name: Interaction unit and integration tests
        run: python -W error::ResourceWarning -m unittest tests.test_interaction_v03 tests.test_host_v03 -v
      - name: 10k interaction saturation + M+10k no-novelty
        run: python scripts/interaction_stress.py --cases 10000 --novelty-tail 10000 --seed 883
      - name: Existing regression suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
