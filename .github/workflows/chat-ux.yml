name: iKant v0.4 chat UX

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  chat-design-system:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m compileall -q ikant tests scripts
      - name: Chat UX unit and durable host integration
        run: python -W error::ResourceWarning -m unittest tests.test_chat_v04 tests.test_chat_host_v04 -v
      - name: 10k executable session-chat saturation plus no-novelty tail
        run: python scripts/chat_ux_stress.py --cases 10000 --novelty-tail 2000 --seed 883
      - name: Durable runtime chat stress
        run: python scripts/chat_runtime_stress.py --turns 60
      - name: Existing regression suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -q

  report:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [chat-design-system]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish v0.4 chat UX receipt
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ needs.chat-design-system.result }}';
            const ok = state === 'success';
            const marker = '<!-- ikant-chat-ux-ci-receipt -->';
            const body = [
              marker,
              '## iKant v0.4 chat UX receipt',
              '',
              `CHAT_UX_CI: ${ok ? 'PASS' : 'FAIL'}`,
              `HEAD_SHA: ${context.sha}`,
              `chat-design-system: ${state}`,
              '',
              'Includes v0.4 unit/integration tests, 10k+2k session-chat saturation, durable runtime chat stress and the existing regression suite.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const previous = comments.find((c) => c.body && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
            if (!ok) core.setFailed(`v0.4 chat UX gate failed: ${state}`);
