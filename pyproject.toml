[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikant"
version = "0.3.0a1"
description = "ROA-aligned compact reticular cognitive runtime with deterministic host interaction contract"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ikant = "ikant.host_cli:main"

[tool.setuptools.packages.find]
include = ["ikant*"]
