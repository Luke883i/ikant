[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikant"
version = "0.13.0a1"
description = "Rights-aware epistemic control runtime with provenance, calibrated uncertainty, hybrid retrieval and causal CRC diagnostics"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ikant = "ikant.app_cli:main"

[tool.setuptools.packages.find]
include = ["ikant*"]
