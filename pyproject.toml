[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikant"
version = "0.12.0a1"
description = "Rights-aware reticular cognitive runtime with digest-bound owner authorization and hardened exclusive dashboard transport"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ikant = "ikant.app_cli:main"

[tool.setuptools.packages.find]
include = ["ikant*"]
