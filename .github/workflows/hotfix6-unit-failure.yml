name: hotfix6 unit failure extractor
on:
  push:
    branches: [diag/hotfix6-unit-failure]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run unit and extract failure
        shell: bash
        run: |
          set +e
          python -W error::ResourceWarning -m unittest discover -s tests -v > /tmp/unit.log 2>&1
          code=$?
          {
            echo "exit=$code"
            grep -n -A18 -B4 '^FAIL:' /tmp/unit.log || true
            grep -n -A18 -B4 '^ERROR:' /tmp/unit.log || true
            tail -n 25 /tmp/unit.log
          } > backlog/hotfix6_unit_failure.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backlog/hotfix6_unit_failure.txt
          git commit -m 'diag: record hotfix6 unit failure' || true
          git push
