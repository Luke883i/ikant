name: iKant v0.8 bounded orientation admission
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  admission_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall -q ikant tests scripts
      - run: python -W error::ResourceWarning -m unittest tests.test_pre_admission_v08 tests.test_admission_policy_v08 tests.test_bootstrap -v

  baseline_10k:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/pre_admission_v08_stress.py --scenarios 10000 --tail 0 --seed 883

  maturity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {seed: [1, 17, 97, 883, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/pre_admission_v08_stress.py --scenarios 80000 --tail 1000 --seed ${{ matrix.seed }}

  mutation_kill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/pre_admission_v08_mutations.py

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -q

  report:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [admission_unit, baseline_10k, maturity, mutation_kill, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish v0.8 admission receipt
        uses: actions/github-script@v7
        with:
          script: |
            const states={
              unit:'${{ needs.admission_unit.result }}',
              baseline:'${{ needs.baseline_10k.result }}',
              maturity:'${{ needs.maturity.result }}',
              mutations:'${{ needs.mutation_kill.result }}',
              regression:'${{ needs.regression.result }}'
            };
            const ok=Object.values(states).every(v=>v==='success');
            const marker='<!-- ikant-v08-admission-ci-receipt -->';
            const body=[
              marker,
              '## iKant v0.8 bounded-orientation admission receipt',
              '',
              `ADMISSION_V08_CI: ${ok?'PASS':'FAIL'}`,
              `HEAD_SHA: ${context.sha}`,
              `unit-policy: ${states.unit}`,
              `baseline[10000]: ${states.baseline}`,
              `maturity[5 x (80000+1000 no-novelty)]: ${states.maturity}`,
              `mutation-kill[18]: ${states.mutations}`,
              `regression: ${states.regression}`,
              '',
              'Orientation is bounded before terms presentation; acquisition freezes after presentation until exact current-session acceptance.'
            ].join('\n');
            const {owner,repo}=context.repo;const issue_number=context.issue.number;
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number,per_page:100});
            const previous=comments.find(c=>c.body&&c.body.includes(marker));
            if(previous)await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
            if(!ok)core.setFailed(`v0.8 admission gates failed: ${JSON.stringify(states)}`);
