[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikant"
version = "0.1.0"
description = "Governed concentric epistemic runtime for conforming AI assistants"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ikant = "ikant.cli:main"

[tool.setuptools.packages.find]
include = ["ikant*"]
